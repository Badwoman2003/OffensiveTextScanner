<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">OTS 三阶段训练流程图</title>
  <desc id="desc">Stage A 中文继续预训练、Stage B 下游微调、Stage C 模态不平衡专项训练的完整流水线。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d67ad"/><stop offset="1" stop-color="#244d85"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b55ad"/><stop offset="1" stop-color="#56377f"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#178f83"/><stop offset="1" stop-color="#11665e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172f49" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#49637d"/></marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#178f83"/></marker>
    <style>
      .title{font:700 36px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#fff}.subtitle{font:400 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#d8e8ff}
      .stage{font:800 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#fff}.stageSub{font:400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e6f0ff}
      .h{font:700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#17324d}.b{font:400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#36536d}.small{font:400 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#557087}.tag{font:700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.formula{font:600 15px Consolas,'Microsoft YaHei',sans-serif;fill:#23435e}.arrow{stroke:#49637d;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <rect width="1800" height="116" fill="#172f52"/>
  <text x="70" y="53" class="title">2. 训练阶段：Stage A → Stage B → Stage C</text>
  <text x="70" y="86" class="subtitle">先建立中文图文对齐能力，再做任务微调，最后按过拟合程度动态平衡三种模态</text>

  <!-- input -->
  <g filter="url(#shadow)"><rect x="70" y="150" width="1660" height="76" rx="20" fill="#fff" stroke="#bfd0e3" stroke-width="2"/></g>
  <rect x="70" y="150" width="260" height="76" rx="20" fill="#243f61"/>
  <text x="200" y="181" text-anchor="middle" style="font:700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#fff">训练输入</text>
  <text x="200" y="207" text-anchor="middle" style="font:400 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#d8e8f8">processed/*.parquet</text>
  <text x="375" y="181" class="b">统一 Sample Schema</text><text x="375" y="207" class="small">text · ocr_text · image_path · label · source · modality_mask</text>
  <rect x="1110" y="169" width="175" height="37" rx="18" fill="#e8f1ff"/><text x="1198" y="193" text-anchor="middle" class="tag" fill="#315b94">中文文本 + OCR</text>
  <rect x="1300" y="169" width="175" height="37" rx="18" fill="#ecf8f4"/><text x="1388" y="193" text-anchor="middle" class="tag" fill="#247665">图像 / 缺失掩码</text>
  <rect x="1490" y="169" width="205" height="37" rx="18" fill="#fff2dc"/><text x="1593" y="193" text-anchor="middle" class="tag" fill="#97641c">数据源 / 标签分层</text>

  <!-- Stage headers -->
  <g filter="url(#shadow)"><rect x="70" y="278" width="500" height="650" rx="24" fill="#fff" stroke="#6d91c5" stroke-width="2"/></g>
  <rect x="70" y="278" width="500" height="105" rx="24" fill="url(#a)"/><rect x="70" y="359" width="500" height="24" fill="#244d85"/>
  <text x="105" y="322" class="stage">Stage A · 中文继续预训练</text><text x="105" y="352" class="stageSub">Continued Pre-Training · 无需下游分类标签</text>

  <g filter="url(#shadow)"><rect x="650" y="278" width="500" height="650" rx="24" fill="#fff" stroke="#9277bd" stroke-width="2"/></g>
  <rect x="650" y="278" width="500" height="105" rx="24" fill="url(#b)"/><rect x="650" y="359" width="500" height="24" fill="#56377f"/>
  <text x="685" y="322" class="stage">Stage B · 下游微调</text><text x="685" y="352" class="stageSub">Offensive Classification · 学习主任务决策边界</text>

  <g filter="url(#shadow)"><rect x="1230" y="278" width="500" height="650" rx="24" fill="#fff" stroke="#3d9b91" stroke-width="2"/></g>
  <rect x="1230" y="278" width="500" height="105" rx="24" fill="url(#c)"/><rect x="1230" y="359" width="500" height="24" fill="#11665e"/>
  <text x="1265" y="322" class="stage">Stage C · 模态不平衡专项</text><text x="1265" y="352" class="stageSub">Gradient Blending · 抑制“只看文本”的捷径</text>

  <!-- stage connectors -->
  <path d="M570 590 H630" class="arrow"/><circle cx="610" cy="590" r="18" fill="#fff" stroke="#49637d" stroke-width="2"/><text x="610" y="596" text-anchor="middle" class="tag" fill="#49637d">①</text>
  <path d="M1150 590 H1210" class="arrow"/><circle cx="1190" cy="590" r="18" fill="#fff" stroke="#49637d" stroke-width="2"/><text x="1190" y="596" text-anchor="middle" class="tag" fill="#49637d">②</text>
  <rect x="1153" y="618" width="76" height="24" rx="12" fill="#fff0d9"/><text x="1191" y="635" text-anchor="middle" style="font:700 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#95601b">gap 过大</text>

  <!-- A content -->
  <text x="105" y="425" class="h">初始化：ViLT 中文化</text>
  <rect x="105" y="446" width="430" height="82" rx="14" fill="#edf4ff"/>
  <text x="128" y="478" class="b">bert-base-chinese tokenizer</text><text x="128" y="505" class="small">Embedding 均值 warm-start + identity 投影层</text>
  <text x="105" y="570" class="h">三任务联合优化</text>
  <rect x="105" y="591" width="430" height="64" rx="14" fill="#f4f7fc" stroke="#d5dfec"/>
  <circle cx="135" cy="623" r="18" fill="#3c6eae"/><text x="135" y="629" text-anchor="middle" class="tag" fill="#fff">M</text><text x="166" y="619" class="b">MLM · 15% Mask</text><text x="166" y="642" class="small">CE · 权重 1.0</text>
  <rect x="105" y="669" width="430" height="64" rx="14" fill="#f4f7fc" stroke="#d5dfec"/>
  <circle cx="135" cy="701" r="18" fill="#3c6eae"/><text x="135" y="707" text-anchor="middle" class="tag" fill="#fff">I</text><text x="166" y="697" class="b">ITM · 50% batch 内图像置换</text><text x="166" y="720" class="small">CE · 权重 1.0</text>
  <rect x="105" y="747" width="430" height="76" rx="14" fill="#f4f7fc" stroke="#d5dfec"/>
  <circle cx="135" cy="785" r="18" fill="#3c6eae"/><text x="135" y="791" text-anchor="middle" class="tag" fill="#fff">W</text><text x="166" y="779" class="b">WPA · IPOT 最优传输</text><text x="166" y="803" class="small">图文 token 对齐 · 权重 0.1</text>
  <rect x="105" y="851" width="430" height="49" rx="14" fill="#dfeafd"/><text x="320" y="882" text-anchor="middle" class="tag" fill="#315b94">产出：中文图文对齐 checkpoint</text>

  <!-- B content -->
  <text x="685" y="425" class="h">监督学习配置</text>
  <rect x="685" y="447" width="430" height="66" rx="14" fill="#f5f0fb"/>
  <text x="708" y="477" class="b">FocalLoss (γ = 2)</text><text x="708" y="500" class="small">缓解 benign 样本占多数；可切换 CE 消融</text>
  <rect x="685" y="527" width="430" height="78" rx="14" fill="#f8f5fc" stroke="#ded3eb"/>
  <text x="708" y="557" class="b">StratifiedModalitySampler</text><text x="708" y="582" class="small">按 source × modality_mask × label 分层</text>
  <rect x="685" y="619" width="430" height="68" rx="14" fill="#f8f5fc" stroke="#ded3eb"/>
  <text x="708" y="649" class="b">Modality Dropout = 0.15</text><text x="708" y="674" class="small">随机置空一路模态，提升缺失鲁棒性</text>
  <text x="685" y="731" class="h">每个 epoch：切片评估</text>
  <rect x="685" y="751" width="430" height="76" rx="14" fill="#f3edf9"/>
  <text x="708" y="780" class="small">text_only F1 · image_only F1 · both F1</text><text x="708" y="807" class="formula">robustness_gap = max(F1) − min(F1)</text>
  <rect x="685" y="851" width="430" height="49" rx="14" fill="#eadff5"/><text x="900" y="882" text-anchor="middle" class="tag" fill="#65408f">按 overall.f1_macro 保存 best checkpoint</text>

  <!-- C content -->
  <text x="1265" y="421" class="h">同一 batch · 三次 backbone</text>
  <rect x="1265" y="445" width="132" height="104" rx="14" fill="#e8f7f4" stroke="#7cc1b8"/>
  <text x="1331" y="477" text-anchor="middle" class="tag" fill="#176e65">Text-only</text><text x="1331" y="506" text-anchor="middle" class="small">logits<tspan baseline-shift="sub">t</tspan></text><text x="1331" y="533" text-anchor="middle" class="formula">L<tspan baseline-shift="sub">t</tspan></text>
  <rect x="1438" y="445" width="132" height="104" rx="14" fill="#e8f7f4" stroke="#7cc1b8"/>
  <text x="1504" y="477" text-anchor="middle" class="tag" fill="#176e65">Image-only</text><text x="1504" y="506" text-anchor="middle" class="small">logits<tspan baseline-shift="sub">i</tspan></text><text x="1504" y="533" text-anchor="middle" class="formula">L<tspan baseline-shift="sub">i</tspan></text>
  <rect x="1611" y="445" width="84" height="104" rx="14" fill="#e8f7f4" stroke="#7cc1b8"/>
  <text x="1653" y="477" text-anchor="middle" class="tag" fill="#176e65">Both</text><text x="1653" y="506" text-anchor="middle" class="small">logits<tspan baseline-shift="sub">m</tspan></text><text x="1653" y="533" text-anchor="middle" class="formula">L<tspan baseline-shift="sub">m</tspan></text>
  <path d="M1331 549 V584 H1480" stroke="#178f83" stroke-width="2.5" fill="none" marker-end="url(#arrowC)"/><path d="M1504 549 V584 H1480" stroke="#178f83" stroke-width="2.5" fill="none"/><path d="M1653 549 V584 H1480" stroke="#178f83" stroke-width="2.5" fill="none"/>
  <rect x="1265" y="584" width="430" height="76" rx="14" fill="#dff3ef"/>
  <text x="1480" y="614" text-anchor="middle" class="h">GradientBlendedLoss</text><text x="1480" y="643" text-anchor="middle" class="formula">L = w<tspan baseline-shift="sub">t</tspan>L<tspan baseline-shift="sub">t</tspan> + w<tspan baseline-shift="sub">i</tspan>L<tspan baseline-shift="sub">i</tspan> + w<tspan baseline-shift="sub">m</tspan>L<tspan baseline-shift="sub">m</tspan></text>
  <text x="1265" y="704" class="h">每个 epoch 动态解权重</text>
  <rect x="1265" y="724" width="430" height="102" rx="14" fill="#f0faf8" stroke="#add8d2"/>
  <text x="1288" y="755" class="small">① 记录各路 Δtrain 与 Δval</text><text x="1288" y="783" class="formula">② OGR = ((Δtrain − Δval)<tspan baseline-shift="sub">+</tspan>)² / Δval²</text><text x="1288" y="811" class="formula">③ w<tspan baseline-shift="sub">k</tspan> ∝ 1 / (OGR<tspan baseline-shift="sub">k</tspan> + ε)，归一化</text>
  <path d="M1695 775 H1720 V622 H1695" stroke="#178f83" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrowC)"/>
  <rect x="1265" y="851" width="430" height="49" rx="14" fill="#d6eee9"/><text x="1480" y="882" text-anchor="middle" class="tag" fill="#176e65">产出：模态均衡的 final checkpoint</text>

  <!-- bottom decision / outcome -->
  <rect x="70" y="972" width="1660" height="93" rx="20" fill="#203b5c"/>
  <text x="105" y="1007" style="font:700 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#fff">阶段衔接</text>
  <text x="105" y="1038" style="font:400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#d9e6f5">Stage A 提供中文多模态初始化 → Stage B 选择主任务最优模型 → robustness gap 过大时进入 Stage C；若 gap 已可接受，可直接采用 Stage B checkpoint。</text>
  <rect x="1435" y="994" width="260" height="47" rx="23" fill="#3e668f"/><text x="1565" y="1024" text-anchor="middle" style="font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#fff">目标：高 F1 + 低模态差距</text>
</svg>
