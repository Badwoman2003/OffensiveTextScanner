services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  backend:
    build:
      context: .
      dockerfile: backend/docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - redis
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "4"]

  worker-cpu:
    build:
      context: .
      dockerfile: backend/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - OTS_DEVICE=cpu
      - CELERY_QUEUES=ocr,cpu_inference
    depends_on:
      - redis
    command: ["celery", "-A", "backend.worker.celery_app:app", "worker", "-Q", "ocr,cpu_inference", "-c", "4", "--loglevel=info"]

  worker-gpu:
    build:
      context: .
      dockerfile: backend/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - OTS_DEVICE=cuda
      - CELERY_QUEUES=gpu_inference
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
    command: ["celery", "-A", "backend.worker.celery_app:app", "worker", "-Q", "gpu_inference", "-P", "solo", "--loglevel=info"]

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  redis-data:
