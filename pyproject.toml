[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ots"
version = "0.2.0"
description = "Offensive Text Scanner: multimodal offensive content detection with ViLT + lightweight OCR"
requires-python = ">=3.10"
authors = [{ name = "OTS Team" }]
license = { text = "MIT" }

dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.29.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pillow>=10.2",
    "rapidocr-onnxruntime>=1.3.15",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "imagehash>=4.3",
]

[project.optional-dependencies]
triton = ["triton>=2.2.0"]
backend = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "slowapi>=0.1.9",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    "locust>=2.24",
]

[project.scripts]
ots-train-cpt = "ots_core.training.stage_a_cpt:main"
ots-train-finetune = "ots_core.training.stage_b_finetune:main"
ots-export = "ots_core.inference.export:main"

[tool.setuptools.packages.find]
include = ["ots_core*", "backend*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
